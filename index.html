<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1712">
<meta name="color-scheme" content="dark">
<title>Father–Daughter Ball · Sponsor Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Cormorant Garamond';font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/cormorant-garamond-500.woff2) format('woff2')}
  @font-face{font-family:'Cormorant Garamond';font-weight:500;font-style:italic;font-display:swap;src:url(assets/fonts/cormorant-garamond-500-italic.woff2) format('woff2')}
  :root{
    --ground:#16110d;              /* Evening: a deep warm espresso behind the cream banner */
    --cream:#ede9dd;
    --cream-dim:rgba(237,233,221,.55);
    --cream-faint:rgba(237,233,221,.28);
    --gold:#cfae6e;
    --didone:"Bodoni Moda","Didot","Bodoni 72","Cormorant Garamond",Georgia,serif;
    --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
    --gutter:clamp(.75rem, 2vw, 1.6rem);
    --r:clamp(6px, .75vw, 12px);
    --deck:72px;                /* control row under the frame */
  }
  *{box-sizing:border-box}
  html{background:var(--ground);transition:background-color 1.4s cubic-bezier(.4,0,.2,1)}
  html.midnight, body.midnight{--ground:#0c0e18}          /* Midnight: the banner's own night sky */
  body{
    margin:0;min-height:100vh;height:100vh;overflow:hidden;
    background:var(--ground);transition:background-color 1.4s cubic-bezier(.4,0,.2,1);
    color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:var(--gutter);
  }
  /* ---------- the panel: frame + one row of controls, the same width ---------- */
  .panel{width:min(100%, calc((100vh - 2 * var(--gutter) - var(--deck)) * 16 / 9));display:grid;grid-template-rows:auto var(--deck)}

  /* ---------- the view ---------- */
  .view{
    position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);background:#000;
    box-shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 18px -6px rgba(0,0,0,.45), 0 48px 100px -36px rgba(0,0,0,.85);
    opacity:0;transform:translateY(18px);
    transition:opacity 1.1s cubic-bezier(.2,.6,.2,1), transform 1.3s cubic-bezier(.2,.6,.2,1);
  }
  .view.is-in{opacity:1;transform:none}
  .view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:var(--r);background:#000;display:block}
  .view::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(237,233,221,.07), inset 0 1px 0 rgba(255,255,255,.14);transition:box-shadow .5s ease}
  @media (hover:hover){ .view:hover::after{box-shadow:inset 0 0 0 1px rgba(237,233,221,.16), inset 0 1px 0 rgba(255,255,255,.2)} }
  .view:fullscreen, .view:fullscreen iframe{border-radius:0}
  .view:fullscreen::after{display:none}

  /* ---------- the deck ---------- */
  .deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding-top:2px}
  .deck .left{display:flex;align-items:center;gap:.5rem;justify-self:start}
  .deck .right{display:flex;align-items:center;gap:.5rem;justify-self:end}
  .deck .right .btn.primary{margin-left:.6rem}
  .btn .sun{display:none}
  body.midnight .btn .sun{display:block}
  body.midnight .btn .moon{display:none}
  .btn{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
    height:40px;min-width:40px;padding:0 .9rem;border-radius:999px;
    font:500 .62rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--cream);
    box-shadow:inset 0 0 0 1px rgba(237,233,221,.18);transition:box-shadow .3s ease,background .3s ease,opacity .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn svg{width:13px;height:13px;flex:none}
  .btn.icon{padding:0;width:40px}
  @media (hover:hover){ .btn:hover{background:rgba(237,233,221,.08);box-shadow:inset 0 0 0 1px rgba(237,233,221,.34)} }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:1px solid rgba(237,233,221,.55);outline-offset:3px}
  .btn.primary{background:var(--cream);color:var(--ground);box-shadow:none;padding:0 1.15rem}
  @media (hover:hover){ .btn.primary:hover{background:#fff} }
  .btn.ghost{box-shadow:none;color:var(--cream-dim)}
  @media (hover:hover){ .btn.ghost:hover{color:var(--cream);background:rgba(237,233,221,.06)} }

  /* centre: where we are — the tick row, with a quiet count beneath it */
  .where{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .ticks{display:flex;gap:5px;align-items:center;height:12px}
  .ticks button{all:unset;cursor:pointer;width:16px;height:12px;display:grid;place-items:center}
  .ticks button i{display:block;width:100%;height:2px;border-radius:2px;background:rgba(237,233,221,.18);transition:background .3s,transform .3s}
  .ticks button[aria-current=true] i{background:var(--gold);transform:scaleY(1.6)}
  @media (hover:hover){ .ticks button:hover i{background:rgba(237,233,221,.5)} }
  .ticks button:focus-visible{outline:1px solid rgba(237,233,221,.55);outline-offset:2px}
  .where .count{font:500 .58rem/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--cream-dim);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
  .where .count em{font-style:normal;color:var(--cream-faint)}
  .paused .where .count::after{content:"  ·  Paused";color:var(--gold)}
  @media (prefers-reduced-motion:reduce){ .view{opacity:1;transform:none;transition:none} }
</style>
</head>
<body>

<div class="panel">
  <div class="view" id="view">
    <iframe id="frame" src="banner.html" title="Sponsor banner" allow="fullscreen *; screen-wake-lock *" allowfullscreen></iframe>
  </div>

  <div class="deck">
    <div class="left">
      <button class="btn icon" id="pause" type="button" title="Pause / resume" aria-pressed="false" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn icon" id="themeBtn" type="button" title="Evening / Midnight" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      </button>
    </div>

    <div class="where" aria-live="polite">
      <div class="ticks" id="ticks" role="tablist" aria-label="Slides"></div>
      <div class="count"><em id="count">1 / 15</em><span id="label"></span></div>
    </div>

    <div class="right">
      <button class="btn icon" id="prev" type="button" title="Previous" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn icon" id="next" type="button" title="Next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="btn primary" id="full" type="button" title="Show the banner fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Fullscreen
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $('frame'), view = $('view');
  const send = msg => { try { frame.contentWindow.postMessage(Object.assign({console: true}, msg), '*'); } catch (e) {} };

  // the view settles in once the banner reports in (with a fallback so it never stays hidden)
  const reveal = () => view.classList.add('is-in');
  frame.addEventListener('load', () => send({cmd: 'hello'}));
  setTimeout(() => send({cmd: 'hello'}), 800);
  setTimeout(reveal, 2500);

  /* ---- theme ---- */
  let theme = 'evening';
  try { if (localStorage.getItem('fdb-theme') === 'midnight'){ document.documentElement.classList.add('midnight'); document.body.classList.add('midnight'); theme = 'midnight'; } } catch (e) {}
  const paint = t => { theme = t; document.documentElement.classList.toggle('midnight', t === 'midnight'); document.body.classList.toggle('midnight', t === 'midnight'); $('themeBtn').title = t === 'midnight' ? 'Switch to Evening' : 'Switch to Midnight'; };
  const flipTheme = () => { const t = theme === 'midnight' ? 'evening' : 'midnight'; send({cmd: 'theme', theme: t}); paint(t); };
  $('themeBtn').addEventListener('click', flipTheme);

  /* ---- transport ---- */
  $('prev').addEventListener('click', () => send({cmd: 'prev'}));
  $('next').addEventListener('click', () => send({cmd: 'next'}));
  let paused = false;
  $('pause').addEventListener('click', () => send({cmd: 'pause', value: !paused}));
  const showPaused = v => {
    paused = v; document.body.classList.toggle('paused', v);
    $('pause').setAttribute('aria-pressed', String(v)); $('pause').setAttribute('aria-label', v ? 'Resume' : 'Pause');
    document.querySelector('.i-pause').style.display = v ? 'none' : ''; document.querySelector('.i-play').style.display = v ? '' : 'none';
  };

  /* ---- fullscreen: just the banner ---- */
  const goFull = () => { if (document.fullscreenElement) document.exitFullscreen(); else (view.requestFullscreen ? view.requestFullscreen() : Promise.reject()).catch(() => {}); };
  $('full').addEventListener('click', goFull);
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    send({cmd: 'fullscreen', value: on});
    if (on) frame.focus();
  });

  /* ---- where we are ---- */
  let total = 0;
  function buildTicks(n){
    if (n === total) return; total = n; const t = $('ticks'); t.textContent = '';
    for (let i = 0; i < n; i++){
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.title = i ? 'Slide ' + (i + 1) : 'Overview';
      b.appendChild(document.createElement('i')); b.addEventListener('click', () => send({cmd: 'goto', slide: i})); t.appendChild(b);
    }
  }
  addEventListener('message', e => {
    const m = e.data || {}; if (m.banner !== true) return;
    if (m.type === 'status'){
      reveal();
      buildTicks(m.total);
      [...$('ticks').children].forEach((b, i) => b.setAttribute('aria-current', String(i === m.slide)));
      $('label').textContent = m.label ? '  ·  ' + m.label : '';
      $('count').textContent = (m.slide + 1) + ' / ' + m.total;
      showPaused(!!m.paused);
      if (m.theme && m.theme !== theme) paint(m.theme);
    } else if (m.type === 'theme'){ paint(m.theme); }
  });

  /* ---- keys work from the console too ---- */
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); send({cmd: 'next'}); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); send({cmd: 'prev'}); }
    else if (e.key === 'Home'){ send({cmd: 'home'}); }
    else if (e.key === 'p' || e.key === 'P'){ send({cmd: 'pause', value: !paused}); }
    else if (e.key === 'm' || e.key === 'M'){ flipTheme(); }
    else if (e.key === 'f' || e.key === 'F'){ goFull(); }
  });

  /* ---- keep the laptop awake while this page is up ---- */
  const keepAwake = async () => { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {} };
  document.addEventListener('visibilitychange', keepAwake); addEventListener('click', keepAwake); keepAwake();
})();
</script>
</body>
</html>
