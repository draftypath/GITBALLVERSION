<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Enchanted Evening · Father–Daughter Ball</title>

<script src="sponsors.js"></script>

<style>
  :root{
    --ink:#2a190b;
    --ink-soft:#46301b;
    --gold-deep:#8a5c1e;
    --gold:#b98634;
    --gold-light:#e9c77f;
    --ivory:#fdf8ef;
    --s:1;               /* sponsor fit scale, set by script */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  html,body{height:100%}
  body{
    overflow:hidden;
    background:#000;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body.idle{cursor:none}

  /* ---------- full-window stage: every piece is placed by script ---------- */
  /* The banner is always a 1920×1080 (16:9) canvas — exactly what the TV shows — scaled to fit
     the window. A window of any other shape gets black bars instead of a different layout. */
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--ivory);
    transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center center}
  .layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* warm room behind everything */
  .bg,.veil{
    background:
      radial-gradient(ellipse 70% 78% at 50% 50%, rgba(0,0,0,0) 55%, rgba(190,148,88,.20) 100%),
      linear-gradient(180deg, #fbf1df 0%, #fdf8ef 42%, #fbf4e7 70%, #f5e7d0 100%);
  }
  .grain{
    opacity:.065;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* the two artwork pieces; their glows and twinkle canvases ride along inside them */
  .piece{position:absolute;pointer-events:none;user-select:none}
  .piece > img, .piece > canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}
  .garland{top:0;aspect-ratio:1908/602}
  .couple{left:0;bottom:calc(-1 * var(--sink,0px));aspect-ratio:var(--cr,1241/1184)}

  .halo,.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .halo{width:48%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,205,118,.40), rgba(255,205,118,0))}
  .glow{width:21%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,214,140,.55), rgba(255,214,140,0));
    animation:breathe 7s ease-in-out infinite}
  .glow.b{animation-delay:-2.4s}.glow.c{animation-delay:-4.7s}
  @keyframes breathe{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.06)}}
  .couple .halo{width:115%;background:radial-gradient(closest-side, rgba(255,186,104,.34), rgba(255,186,104,0))}
  /* the father & daughter belong to the title page; every page after it signs off with the Rotary footer,
     which stays put from the Thank You page through every sponsor */
  .couple, .host-bar{transition:opacity calc(var(--fade,1.8s) * .5) cubic-bezier(.4,0,.2,1)}
  #stage.hide-couple .couple{opacity:0 !important}
  .host-bar{
    position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;align-items:center;gap:22px;
    opacity:0;pointer-events:none;color:var(--ink);
  }
  #stage.show-bar .host-bar{opacity:1;transition-delay:calc(var(--fade,1.8s) * .35)}
  .host-bar .seal{top:-3px;--sz:104px;width:var(--sz);height:var(--sz);box-shadow:0 0 0 1px #cfa75e,0 0 0 4px rgba(255,252,244,.95),0 0 0 5px rgba(196,150,74,.7),0 6px 16px rgba(120,80,25,.18)}
  .host-bar .seal img{width:91px;height:91px}
  .hb-kicker{font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;font-size:21px;letter-spacing:.24em;color:var(--gold-deep);text-transform:uppercase}
  .hb-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:36px;line-height:1;color:var(--ink);margin-left:-6px}
  .hb-sep{width:5px;height:5px;transform:rotate(45deg);background:linear-gradient(135deg,#f0d394,#a87428);margin:0 4px}
  .hb-motto{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:32px;color:var(--gold-deep)}
  [data-theme=midnight] .host-bar .seal{box-shadow:0 0 0 1px #d9b46c,0 0 0 4px rgba(20,22,36,.9),0 0 0 5px rgba(216,178,110,.8),0 8px 20px rgba(0,0,0,.45)}
  .still .couple,.still .host-bar,.still .title-page{transition:none}
  .nopaint #couple{display:none !important}

  /* ---------- message column (designed at 1040 × 800, scaled to fit) ---------- */
  .content{
    position:absolute;left:0;top:0;width:1040px;height:800px;
    transform-origin:0 0;visibility:hidden;
    color:var(--ink);
  }
  /* each slide is a layer in the same column; only opacity changes, so the scene never moves */
  .slide{position:absolute;left:0;top:0;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    opacity:0;pointer-events:none;
    /* leaving: clears first; arriving: waits for that, then settles in */
    transition:opacity calc(var(--fade,1.8s) * .5) cubic-bezier(.4,0,.2,1)}
  .slide.on{opacity:1;transition:opacity calc(var(--fade,1.8s) * .8) cubic-bezier(.4,0,.2,1) calc(var(--fade,1.8s) * .35)}
  .slide.sponsor{justify-content:flex-start;gap:0;padding-top:0}
  .slide.sponsor .thanks{font-size:150px}
  .sp-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
  .sp-body .plaque{margin-top:0}
  .sp-body .plaque + .sp-note{margin-top:34px}
  /* the status sits beneath the logo like a caption, then the thank-you line */
  .sp-body .tier-label{order:2}
  .sp-body .sp-note{order:3}
  .slide.sponsor .sp-body .tier-label{margin:36px 0 0}
  .slide.sponsor .sp-body .sp-note{margin-top:20px}
  .slide.sponsor .tier-label{font-size:32px}
  .slide.sponsor .sp-name{font-size:66px}
  .slide.sponsor .sp-note{font-size:36px}
  .slide.sponsor .plaque{margin-top:0}
  .slide.sponsor .sp-name{margin-top:30px}
  .slide.sponsor .thanks{font-size:120px;margin:-.3em 0 -.3em;padding:.3em .14em .34em}
  .slide.sponsor .tier-label{font-size:30px;letter-spacing:.3em;padding-left:.3em;margin:0 0 30px}
  .slide.sponsor .tier-label::before,.slide.sponsor .tier-label::after{width:46px}
  .slide.sponsor .tier-label[data-metal]{font-size:34px;font-weight:700}   /* paid status line on their own slide: one step bolder */
  .slide.sponsor.premium .sp-name{font-size:70px}
  .plaque{
    position:relative;margin-top:34px;border-radius:18px;background:#fffdf7;flex:none;
    display:grid;place-items:center;overflow:hidden;
    box-shadow:0 0 0 1.5px #cfa75e, 0 0 0 6px rgba(255,252,244,.95), 0 0 0 7.5px rgba(196,150,74,.6),
               0 22px 50px rgba(120,80,25,.16), 0 0 70px rgba(255,214,140,.35);
  }
  .plaque img{width:100%;height:100%;object-fit:contain;display:block}
  /* paid tiers: a soft halo behind the logo card, in the tier's own metal */
  .slide.sponsor[data-metal] .plaque{
    box-shadow:0 0 0 1.5px #cfa75e, 0 0 0 6px rgba(255,252,244,.95), 0 0 0 7.5px rgba(196,150,74,.6),
               0 22px 50px rgba(120,80,25,.16), 0 0 10px 2px var(--aura), 0 0 30px 6px var(--aura), 0 0 64px 10px var(--aura2);
  }
  .slide.sponsor[data-metal=premier], .slide.sponsor[data-metal=gold]{--aura:rgba(228,164,62,.62);--aura2:rgba(244,190,96,.36)}
  .slide.sponsor[data-metal=blue]  {--aura:rgba(74,112,206,.48);--aura2:rgba(108,142,222,.28)}
  .slide.sponsor[data-metal=silver]{--aura:rgba(128,138,158,.55);--aura2:rgba(156,166,184,.30)}
  .sp-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:60px;line-height:1.1;color:var(--ink);margin-top:36px;text-wrap:balance;max-width:960px}
  .sp-name.solo{font-size:96px;margin-top:40px}
  .sp-note{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:33px;line-height:1.25;color:var(--ink-soft);margin-top:14px}
  .still .slide{transition:none}
  .content::before{content:"";position:absolute;left:50%;top:50%;width:1300px;height:900px;z-index:-1;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,254,249,.95), rgba(255,254,249,0))}

  .overline{
    display:flex;align-items:center;gap:26px;
    font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:27px;letter-spacing:.38em;color:var(--gold-deep);
    padding-left:.4em; /* balance trailing letter-spacing */
  }
  .overline .rule{width:86px;height:1px;flex:none;
    background:linear-gradient(90deg,rgba(185,134,52,0),rgba(185,134,52,.9))}
  .overline .rule:last-child{transform:scaleX(-1)}

  .thanks{
    font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
    font-weight:400;font-size:calc(204px * var(--h,1));line-height:1.02;
    margin:calc(30px * var(--h,1) - .3em) 0 -.3em;padding:.3em .14em .36em;white-space:nowrap;
    background:
      linear-gradient(100deg, rgba(255,236,186,0) 44%, rgba(255,236,186,.85) 50%, rgba(255,236,186,0) 56%),
      linear-gradient(180deg, #a87229 0%, #8d5b1c 55%, #744813 100%);
    background-size:300% 100%, 100% 100%;background-position:100% 0, 0 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1.5px 0 rgba(255,251,240,.9)) drop-shadow(0 8px 22px rgba(138,92,30,.22));
    animation:glint 11s ease-in-out infinite;
  }
  /* the highlight waits off to the left, sweeps across once, then rests off to the right */
  @keyframes glint{0%,58%{background-position:100% 0, 0 0}86%,100%{background-position:0% 0, 0 0}}
  /* the shine restarts each time a page arrives, so it always crosses the script while you're looking:
     about three seconds in, then every eleven seconds while the page stays up */
  @keyframes glintOn{0%,58%{background-position:100% 0, 0 0}86%,100%{background-position:0% 0, 0 0}}
  .slide.on .thanks, .title-page.on .tp-script{animation:glintOn 11s ease-in-out -3.6s infinite}

  .sub{
    font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;
    font-size:calc(44px * var(--h,1));line-height:1.2;color:var(--ink-soft);margin-top:calc(-14px * var(--h,1));
  }

  .ornament{width:380px;height:34px;margin:16px 0 18px;flex:none;overflow:visible}

  /* sponsors — auto-fitted via --s */
  .sponsors{
    flex:1 1 auto;min-height:0;width:100%;
    display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
    gap:calc(34px * var(--s));
  }
  .tier{display:flex;flex-direction:column;align-items:center;gap:calc(12px * var(--s));width:100%}
  .tier-label{
    display:flex;align-items:center;gap:16px;
    font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:calc(24px * var(--s));letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;
    color:var(--lab,var(--gold-deep));
  }
  .tier-label[data-metal=blue]{--lab:#2c4f94;--metal:linear-gradient(180deg,#4570c2 0%,#2a4d97 52%,#1d3a78 100%)}
  .tier-label[data-metal=silver]{--lab:#6a6e76;--metal:linear-gradient(180deg,#8d939d 0%,#60656e 52%,#4b5058 100%)}
  .tier-label[data-metal=gold]{--lab:#8f6818;--metal:linear-gradient(180deg,#b38a2c 0%,#8a6414 52%,#6d4d0a 100%)}
  .tier-label[data-metal=premier]{--lab:#8a5c1e;--metal:linear-gradient(180deg,#ad7c2e 0%,#86581a 52%,#6a430f 100%)}
  .tier-label::before,.tier-label::after{content:"";width:calc(34px * var(--s));height:1px;background:var(--lab,var(--gold-deep));opacity:.55}
  /* the paid tiers read as engraved metal: bold small caps, a polished face, a hairline of light beneath */
  .tier-label[data-metal]{font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600}
  .tier-label[data-metal] .mt{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,251,240,.95)) drop-shadow(0 3px 8px rgba(120,80,25,.14))}
  .t0 .tier-label[data-metal]{font-size:calc(29px * var(--s))}
  .names{display:flex;flex-direction:column;align-items:center;gap:calc(16px * var(--s));width:100%}
  .line{display:flex;justify-content:center;align-items:center;white-space:nowrap}
  .name{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:calc(var(--fs) * var(--s));line-height:1.18;color:var(--ink);
    white-space:nowrap;
  }
  /* headline sponsor */
  .t0 .names{position:relative}
  .t0 .names::before{content:"";position:absolute;left:50%;top:50%;width:calc(600px * var(--s));height:calc(180px * var(--s));
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,236,190,.85),rgba(255,236,190,0));pointer-events:none}
  .t0 .name{--fs:140px;line-height:1.02;position:relative}
  .gild{
    display:inline-block;padding:0 .08em;letter-spacing:.02em;
    background:
      linear-gradient(100deg, rgba(255,232,178,0) 44%, rgba(255,232,178,.8) 50%, rgba(255,232,178,0) 56%),
      linear-gradient(180deg, #8f5d1c 0%, #74470f 55%, #5a3508 100%);
    background-size:300% 100%, 100% 100%;background-position:100% 0, 0 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1.5px 0 rgba(255,251,240,.95)) drop-shadow(0 6px 16px rgba(120,78,22,.28));
    animation:glint 11s ease-in-out 8.6s infinite;
  }
  /* single-sponsor tiers sharing a row */
  .tier.cells{flex-direction:row;justify-content:center;align-items:stretch;width:auto;flex:none}
  .cell{flex:none;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:calc(8px * var(--s));padding:0 calc(32px * var(--s))}
  .cell + .cell{box-shadow:inset 1px 0 0 rgba(185,134,52,.35)}
  .cell .tier-label::before,.cell .tier-label::after{display:none}
  .cell .name{--fs:62px}
  .cell .tier-label{font-size:calc(32px * var(--s))}
  .tier.cells{position:relative}
  .tier.cells::before{content:"";position:absolute;left:50%;top:50%;width:112%;height:190%;z-index:-1;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,238,198,.62),rgba(255,238,198,0))}
  /* list tiers */
  .t2 .name{--fs:39px}
  .t2{gap:calc(22px * var(--s))}
  /* the paid tiers lead with the name; their status sits beneath it */
  .t0{flex-direction:column-reverse;gap:calc(4px * var(--s))}
  .cell{flex-direction:column-reverse}
  .cell .tier-label{margin-top:calc(4px * var(--s))}
  /* a little more air before the General list, so the last status line and its heading don't read as one */
  .t2{margin-top:calc(14px * var(--s))}
  .t2 .tier-label{font-size:calc(29px * var(--s));letter-spacing:.26em;padding-left:.26em}
  [data-theme=midnight] .t2 .tier-label{--lab:#e6c684}
  .sep{
    width:calc(7px * var(--s));height:calc(7px * var(--s));margin:0 calc(22px * var(--s));flex:none;
    transform:rotate(45deg);
    background:linear-gradient(135deg,#f0d394,#a87428);
  }

  /* Rotary seal (title page + sponsor sign-off bar) */
  .seal{
    position:relative;width:156px;height:156px;border-radius:50%;flex:none;
    display:grid;place-items:center;
    background:radial-gradient(circle at 40% 35%, #fffdf8 0%, #fbf3e3 60%, #f3e3c6 100%);
    box-shadow:
      0 0 0 1.5px #cfa75e,
      0 0 0 6px rgba(255,252,244,.95),
      0 0 0 7.5px rgba(196,150,74,.75),
      0 10px 26px rgba(120,80,25,.20),
      0 0 60px rgba(255,214,140,.55);
  }
  .seal img{width:136px;height:136px;display:block}
  .host-text{text-align:center}
  .host-kicker{
    font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:19px;letter-spacing:.26em;padding-left:.26em;color:var(--gold-deep);text-transform:uppercase;
  }
  .host-name{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:36px;line-height:1.08;color:var(--ink);margin-top:4px;text-wrap:balance;
  }
  .motto{
    font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;
    font-size:25px;color:var(--gold-deep);margin-top:6px;
  }

  /* ---------- title page (designed 1100 wide, scaled + placed by script on the message's axis) ---------- */
  .title-page{position:absolute;left:0;top:0;width:1400px;transform-origin:0 0;visibility:hidden;
    display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity calc(var(--fade,1.8s) * .5) cubic-bezier(.4,0,.2,1)}
  .title-page.on{opacity:1;transition:opacity calc(var(--fade,1.8s) * .8) cubic-bezier(.4,0,.2,1) calc(var(--fade,1.8s) * .35)}
  .title-page::before{content:"";position:absolute;left:50%;top:46%;width:1400px;height:980px;z-index:-1;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,254,249,.95), rgba(255,254,249,0))}
  .tp-kicker{
    display:flex;align-items:center;gap:28px;white-space:nowrap;margin-bottom:30px;
    font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:36px;letter-spacing:.38em;color:var(--gold-deep);text-transform:uppercase;
  }
  .tp-kicker #tpArticle{margin-right:-.38em}   /* the trailing letter-space would pull the words off-centre */
  .tp-kicker .rule,.tp-event .rule{width:80px;height:1px;flex:none;background:linear-gradient(90deg,rgba(185,134,52,0),rgba(185,134,52,.9))}
  .tp-kicker .rule:last-child,.tp-event .rule:last-child{transform:scaleX(-1)}
  .thanks.tp-script{font-size:184px;line-height:1;margin:-.26em 0 -.38em;padding:.3em .16em .4em;animation-delay:2.5s}
  .tp-event{
    display:flex;align-items:center;gap:30px;margin-top:20px;white-space:nowrap;
    font-family:"Cormorant SC","Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:44px;line-height:1;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;
  }
  .tp-event #event{margin-right:-.3em}
  .tp-event .rule{width:96px}
  .title-page .ornament{margin:36px 0 40px}
  /* the host, stacked on the centre line like the foot of an invitation */
  .tp-host{display:flex;flex-direction:column;align-items:center;gap:40px}
  .tp-host .seal{width:140px;height:140px}
  .tp-host .seal img{width:123px;height:123px}
  .tp-host .host-text{text-align:center}
  .tp-host .host-kicker{font-size:24px;letter-spacing:.28em;padding-left:.28em}
  .tp-host .host-name{font-size:45px;margin-top:12px;white-space:nowrap}
  .tp-host .motto{font-size:32px;margin-top:10px}
  [data-theme=midnight] .title-page::before{background:radial-gradient(closest-side, rgba(255,196,120,.03), rgba(255,196,120,0))}
  /* the title page's gold lines read a shade brighter after dark */
  [data-theme=midnight] .tp-kicker, [data-theme=midnight] .tp-host .host-kicker, [data-theme=midnight] .tp-host .motto{color:#ebcd8e}
  [data-theme=midnight] .tp-kicker .rule,[data-theme=midnight] .tp-event .rule{background:linear-gradient(90deg,rgba(216,178,110,0),rgba(216,178,110,.85))}

  /* ---------- entrance ---------- */
  /* Everything moves on opacity + transform only (GPU-composited, smooth on TV hardware),
     with long, gentle ease-out curves. Nothing starts until fonts + art are ready (.go). */
  #stage:not(.go) *{animation-play-state:paused !important}
  /* Everything appears at once: a cream veil (identical to the background) dissolves away. */
  .veil{z-index:10;animation:unveil 2.8s cubic-bezier(.4,0,.2,1) .3s both}
  @keyframes unveil{from{opacity:1}to{opacity:0;visibility:hidden}}
  .thanks{animation-delay:5s}

  .measuring .chunk{transform:none !important}
  .webkit .thanks, .webkit .gild, .webkit .tier-label .mt{filter:none !important}
  .still *, .still .glow{animation:none !important;transition:none !important}
  .still .veil{display:none}
  .still .ornament path,.still .ornament line{stroke-dashoffset:0}
  .still .ornament .heart{opacity:1}
  /* =================== MIDNIGHT: the same room, later in the evening =================== */
  :root[data-theme=midnight]{
    --ink:#f3e8d4; --ink-soft:#dccbae; --gold-deep:#d8b26e; --gold:#c9a25e; --ivory:#0c0e18;
    color-scheme:dark;
  }
  [data-theme=midnight] body{background:#000}
  [data-theme=midnight] .bg, [data-theme=midnight] .veil{
    background:

        for (const sh of tshapes) rtT = Math.max(rtT, vinesBelow(L + sh.x0 * s, L + sh.x1 * s) + gap * 2.2 - sh.y0 * s);
        const room = tBottom - rtT - tpH * s;
        yT = rtT + Math.max(0, room) * .2;
        const clear = tshapes.every(sh => yT + sh.y1 * s <= topUnder(L + sh.x0 * s, L + sh.x1 * s) - 26 * k);
        if (room >= 0 && clear) break;
        s *= .985;
      }
      if (!bestT || s > bestT.s * 1.01) bestT = {L, y: yT, s};
    }
    tp.style.transform = `translate(${bestT.L}px, ${bestT.y}px) scale(${bestT.s})`;
    tp.style.visibility = 'visible';

    sizeViewportCanvases(W, H);
    if (!ANIMATE) requestAnimationFrame(draw);
  }

  /* ---- keep the laptop (and so the TV) from sleeping while the banner is up ---- */
  const keepAwake = async () => {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {}
  };
  document.addEventListener('visibilitychange', keepAwake);
  addEventListener('click', keepAwake); addEventListener('keydown', keepAwake);
  keepAwake();

  /* ---- fit the 16:9 stage to the window ---- */
  function fitStage(){ stage.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080)); }
  fitStage();
  addEventListener('resize', fitStage);
  document.querySelectorAll('.piece').forEach(el => el.addEventListener('animationend', () => { el.style.animation = 'none'; }, {once: true}));

  /* ---- fullscreen + idle cursor ---- */
  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
  $('fsBtn').addEventListener('click', e => { e.stopPropagation(); fs(); });
  $('fsBtn').addEventListener('dblclick', e => e.stopPropagation());
  // first time the mouse moves, if the page isn't filling the screen yet, show the keys once
  const isFull = () => !!document.fullscreenElement || (innerWidth >= screen.width - 2 && innerHeight >= screen.height - 2);
  let hinted = false;
  addEventListener('mousemove', () => {
    if (hinted || STILL || isFull()) return; hinted = true;
    const h = $('hint'); h.classList.add('show'); setTimeout(() => h.classList.remove('show'), 6000);
  }, {passive: true});
  document.addEventListener('fullscreenchange', () => $('hint').classList.remove('show'));
  addEventListener('dblclick', fs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); };
  addEventListener('mousemove', wake); wake();

  /* ---- light sprites ---- */
  function sprite(r, stops){
    const c = document.createElement('canvas'); c.width = c.height = r*2;
    const g = c.getContext('2d'), gr = g.createRadialGradient(r,r,0,r,r,r);
    stops.forEach(([o,col]) => gr.addColorStop(o,col));
    g.fillStyle = gr; g.fillRect(0,0,r*2,r*2); return c;
  }
  const halo     = sprite(64, [[0,'rgba(255,226,160,.9)'],[.18,'rgba(255,206,120,.55)'],[.5,'rgba(255,190,100,.14)'],[1,'rgba(255,190,100,0)']]);
  const mote     = sprite(16, [[0,'rgba(255,240,200,1)'],[.25,'rgba(232,186,96,.85)'],[.6,'rgba(214,160,70,.25)'],[1,'rgba(214,160,70,0)']]);
  const orb      = sprite(128,[[0,'rgba(255,212,140,.55)'],[.55,'rgba(255,212,140,.28)'],[.8,'rgba(255,212,140,.08)'],[1,'rgba(255,212,140,0)']]);
  const dimDot   = sprite(32, [[0,'rgba(120,72,20,1)'],[.45,'rgba(150,95,35,.7)'],[1,'rgba(160,110,50,0)']]);
  const bloomDot = sprite(64, [[0,'rgba(255,236,190,1)'],[.15,'rgba(255,214,140,.8)'],[.45,'rgba(255,180,90,.22)'],[1,'rgba(255,170,80,0)']]);
  const flameGlow= sprite(96, [[0,'rgba(255,214,140,.95)'],[.2,'rgba(255,170,80,.55)'],[.55,'rgba(240,130,50,.16)'],[1,'rgba(230,120,40,0)']]);
  const flameCore= sprite(24, [[0,'rgba(255,250,225,1)'],[.4,'rgba(255,220,150,.7)'],[1,'rgba(255,200,120,0)']]);

  const rnd = (a,b) => a + Math.random()*(b-a);
  // string lights + chandelier candles in the garland (its own pixel space, so they follow it anywhere)
  const lights = ASSETS.lights.map(([x,y,s]) => ({
    x, y, s,
    p: rnd(0, 6.28),            // phase, so neighbours never pulse together
    f: rnd(.18, .55),           // slow: one breath every ~2–5 s
    d: rnd(.35, 1),             // how deep this bulb dips
  }));
  let candles = [];
  function setCouple(ix){
    coupleIx = ix % COUPLES.length; const cp = COUPLES[coupleIx];
    CPL = {w: cp.w, h: cp.h};
    $('couple').style.setProperty('--cr', cp.w + '/' + cp.h);
    for (const id of ['cDim', 'cBloom']){ $(id).width = cp.w; $(id).height = cp.h; }
    candles = cp.candles.map(([x,y,k]) => ({x, y, k, p: rnd(0, 100), w: 0}));
  }
  setCouple(0);
  const glints = [];

  // viewport-wide layers (soft bokeh behind, gold dust in front), drawn in fractions of the window
  const DPR = Math.min(devicePixelRatio || 1, 1.5);
  const bkC = $('bokeh'), fxC = $('fx');
  const bk = bkC.getContext('2d'), fx = fxC.getContext('2d');
  // soft glows and dust gain nothing above 1080p, so their canvases never exceed it (big win on 4K TVs)
  function sizeViewportCanvases(W, H){
    const q = Math.min(DPR, 1920 / W, 1080 / H, 1.5);
    for (const cv of [bkC, fxC]){ cv.width = Math.round(W * q); cv.height = Math.round(H * q); }
  }
  const orbs  = Array.from({length:3}, () => ({x:rnd(.2,.88), y:rnd(.22,.83), r:rnd(34,70), a:rnd(.025,.05), vx:rnd(-.002,.002), vy:rnd(-.003,.003), p:rnd(0,6.28)}));
  const newMote = anyY => ({x:rnd(0,1), y:anyY?rnd(0,1):rnd(1.0,1.05), r:rnd(2.5,7), vy:rnd(.006,.015), sw:rnd(10,30), sp:rnd(.2,.6), p:rnd(0,6.28), a:rnd(.3,.66)});
  const motes = Array.from({length:58}, () => newMote(true));

  const gDm = $('gDim').getContext('2d'), gBl = $('gBloom').getContext('2d'), gFx = $('gFx').getContext('2d');
  const cDm = $('cDim').getContext('2d'), cBl = $('cBloom').getContext('2d');
  let last = performance.now(), nextGlint = 0, frameN = 0, lastArt = 0;

  function draw(now){
    const t = now/1000, dt = Math.min(.05, (now-last)/1000); last = now;
    const W = bkC.width, H = bkC.height, u = Math.min(W/1920, H/1080);
    const night = root.dataset.theme === 'midnight' ? 1.1 : 1;   // bokeh glows a touch brighter after dark

    // bokeh behind the art
    bk.clearRect(0,0,W,H);
    for (const o of orbs){
      if (ANIMATE){ o.x += o.vx*dt; o.y += o.vy*dt; if (o.x<.16||o.x>.92) o.vx*=-1; if (o.y<.18||o.y>.9) o.vy*=-1; }
      const r = o.r*u;
      bk.globalAlpha = Math.min(1, o.a * night * (ANIMATE ? .75 + .25*Math.sin(t*.4+o.p) : 1));
      bk.drawImage(orb, o.x*W-r, o.y*H-r, r*2, r*2);
    }

    // twinkles + flicker change slowly, so they redraw at 30 fps; the drifting dust stays at 60
    const doArt = !ANIMATE || (frameN++ & 1) === 0;
    const adt = Math.min(.1, t - lastArt); if (doArt) lastArt = t;
    if (doArt){
    // garland: each bulb slowly breathes between a soft amber dip and a warm bloom
    gDm.clearRect(0,0,TOP.w,TOP.h); gBl.clearRect(0,0,TOP.w,TOP.h); gFx.clearRect(0,0,TOP.w,TOP.h);
    for (const l of lights){
      let v = ANIMATE ? .5 + .5*Math.sin(t*l.f*6.283 + l.p) : .62;
      if (ANIMATE) v = Math.min(1, Math.max(0, v + Math.sin(t*2.7 + l.p*3)*.06));
      const dip = Math.pow(1 - v, 2) * l.d;          // only near the bottom of the breath
      if (dip > .01){
        const r = l.s*1.15 + 3;
        gDm.globalAlpha = dip * .55;
        gDm.drawImage(dimDot, l.x-r, l.y-r, r*2, r*2);
      }
      const r = (7 + l.s*2.4) * (.8 + .35*v);
      gBl.globalAlpha = .12 + Math.pow(v, 1.6) * .6;
      gBl.drawImage(bloomDot, l.x-r, l.y-r, r*2, r*2);
    }
    // occasional star glint on a bulb
    if (ANIMATE && now > nextGlint && lights.length){
      const l = lights[(Math.random()*lights.length)|0];
      glints.push({x:l.x, y:l.y, t0:t, len:rnd(16,30)});
      nextGlint = now + rnd(350, 900);
    }
    for (let i = glints.length-1; i >= 0; i--){
      const g = glints[i], k = (t-g.t0)/1.3;
      if (k >= 1){ glints.splice(i,1); continue; }
      const a = Math.sin(k*Math.PI), L = g.len*a;
      gFx.globalAlpha = a*.9;
      gFx.strokeStyle = 'rgba(255,246,220,1)'; gFx.lineWidth = 1.2; gFx.lineCap = 'round';
      gFx.beginPath();
      gFx.moveTo(g.x-L,g.y); gFx.lineTo(g.x+L,g.y);
      gFx.moveTo(g.x,g.y-L*.8); gFx.lineTo(g.x,g.y+L*.8);
      gFx.stroke();
      gFx.drawImage(halo, g.x-14*a-4, g.y-14*a-4, (14*a+4)*2, (14*a+4)*2);
    }

    // table candles: a warm, slightly irregular flicker
    cDm.clearRect(0,0,CPL.w,CPL.h); cBl.clearRect(0,0,CPL.w,CPL.h);
    for (const c of candles){
      let n = 0;
      if (ANIMATE){
        const q = t + c.p;
        n = Math.sin(q*6.1)*.35 + Math.sin(q*10.7 + 1.3)*.22 + Math.sin(q*2.3 + 4.1)*.3 + Math.sin(q*17.9)*.1;
        c.w += ((Math.random()-.5)*2.4 - c.w*3) * adt;  // tiny random gusts
        n += c.w * .5;
      }
      const R = 54*c.k * (1 + n*.08);
      cBl.globalAlpha = Math.min(1, Math.max(0, .5 + n*.32));
      cBl.drawImage(flameGlow, c.x-R, c.y+6*c.k-R, R*2, R*2);
      if (n < 0){                                     // the flame briefly ducks
        const D = 26*c.k;
        cDm.globalAlpha = -n * .3;
        cDm.drawImage(dimDot, c.x-D, c.y+10*c.k-D, D*2, D*2);
      }
      const r = 9*c.k * (1 + n*.12), sway = ANIMATE ? Math.sin(t*3.3 + c.p)*.7 : 0;
      cBl.globalAlpha = Math.max(0, .55 + n*.25);
      cBl.drawImage(flameCore, c.x+sway-r, c.y-r*1.25, r*2, r*2.5);
    }

    }

    // drifting gold dust
    fx.clearRect(0,0,W,H);
    for (let i = 0; i < motes.length; i++){
      const m = motes[i];
      if (ANIMATE){ m.y -= m.vy*dt; if (m.y < -.02) motes[i] = newMote(false); }
      const r = m.r*u, x = m.x*W + (ANIMATE ? Math.sin(t*m.sp+m.p)*m.sw*u : 0);
      fx.globalAlpha = Math.min(1, m.a * (night > 1 ? 1.25 : 1) * (ANIMATE ? .55 + .45*Math.sin(t*1.7+m.p*3) : .8));
      fx.drawImage(mote, x-r, m.y*H-r, r*2, r*2);
    }
    gDm.globalAlpha = gBl.globalAlpha = gFx.globalAlpha = cDm.globalAlpha = cBl.globalAlpha = fx.globalAlpha = 1;
    if (ANIMATE) requestAnimationFrame(draw);
  }

  /* ---- a long sponsor name stays on one line rather than wrapping to two ---- */
  function flattenNames(){
    document.querySelectorAll('.slide.sponsor .sp-name').forEach(n => {
      n.style.whiteSpace = 'nowrap'; n.style.maxWidth = 'none';
      const room = 1000, w = n.scrollWidth;
      if (w > room) n.style.fontSize = (parseFloat(getComputedStyle(n).fontSize) * Math.max(.72, room / w)) + 'px';
    });
  }

  /* ---- very short, wide logos (e.g. a one-line wordmark) leave "Thank You" stranded above a lot of
     empty space; on those slides it joins the centred group, at the same gap the other slides use ---- */
  function snugShortLogos(){
    const info = [...document.querySelectorAll('.slide.sponsor')].map(sl => {
      const t = sl.querySelector(':scope > .thanks'), b = sl.querySelector('.sp-body');
      if (!t || !b || !b.children.length) return null;
      const kids = [...b.children];
      const top = Math.min(...kids.map(k => k.offsetTop)), bot = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight));
      return {sl, t, b, gap: top - (t.offsetTop + t.offsetHeight), free: (b.clientHeight - (bot - top)) / 2};   // offsets are all relative to the slide
    }).filter(Boolean);
    const usual = info.filter(x => x.free <= 100).map(x => x.gap).sort((a, b) => a - b);
    const gap = usual.length ? usual[usual.length >> 1] : 114;
    for (const x of info) if (x.free > 100){
      x.t.classList.add('in-group');
      x.t.style.marginBottom = gap + 'px';
      x.b.insertBefore(x.t, x.b.firstChild);
    }
  }

  /* ---- slideshow: the overview, then one slide per sponsor, in rank order; loops ---- */
  const T = Object.assign({premier: 16, gold: 13, royal: 11, silver: 10, tier: 10, general: 8, fade: 1.8}, BANNER.timing || {});
  if (!T.overview) T.overview = 3 * T.general;
  const NOTES = Object.assign({premier: 'Our deepest thanks for making this evening possible',
                               tier: 'With sincere thanks for your generous support',
                               general: 'With sincere thanks for your generous support'}, BANNER.notes || {});
  root.style.setProperty('--fade', T.fade + 's');
  if (!T.title) T.title = 12;
  const titlePage = $('titlePage');
  const slides = [{el: titlePage, secs: T.title, label: 'Title'}, {el: overview, secs: T.overview, label: 'Thank You'}];
  // the garland runs through everything; the painting belongs to the title page, the Rotary footer to every page after it,
  // and the message column has one frame for the Thank You page and one for the sponsors
  const hasPaint = el => el === titlePage;
  const hasBar   = el => el !== titlePage;
  const frameOf  = el => el === titlePage ? 't' : el === overview ? 'o' : 's';
  const sceneFor = el => { stage.classList.toggle('hide-couple', !hasPaint(el)); stage.classList.toggle('show-bar', hasBar(el)); };
  const logoLoads = [];
  for (const t of tiers) for (const sp of t.sponsors){
    const el = document.createElement('section'); el.className = 'slide sponsor' + (t.kind !== 'general' ? ' premium' : '');
    if (t.kind !== 'general' && metal(t.tier || '')) el.dataset.metal = metal(t.tier);
    const h = document.createElement('h2'); h.className = 'thanks'; h.textContent = 'Thank You'; el.appendChild(h);
    const body = document.createElement('div'); body.className = 'sp-body'; el.appendChild(body);
    if (t.tier){ const lab = label(t.tier.replace(/s$/i, '')); body.appendChild(lab); }   // the tier introduces the logo
    if (sp.logo){
      const pl = document.createElement('div'); pl.className = 'plaque';
      const img = document.createElement('img'); img.alt = sp.name; pl.appendChild(img); body.appendChild(pl);
      if (sp.tile) pl.style.background = sp.tile;
      const big = t.kind === 'premier';
      const grow = Math.min(1.3, Math.max(.6, +sp.size || 1));     // optional per-sponsor "size" in sponsors.js
      const maxW = (big ? 1060 : 990) * grow, maxH = (big ? 470 : 435) * grow;   // the logo is the slide: no printed name beneath it
      // a sensible card before the logo arrives, so nothing can ever size itself to a raw 1400px image
      pl.style.width = maxW * .8 + 'px'; pl.style.height = maxH * .8 + 'px'; pl.style.padding = '30px';
      const fit = () => {
        const nw = img.naturalWidth, nh = img.naturalHeight;
        if (!(nw > 0 && nh > 0)) return false;
        // the card takes the logo's own proportions, inside a sensible maximum
        const k = Math.min(maxW / nw, maxH / nh), w = nw * k, hgt = nh * k;
        const pad = sp.tile ? 0 : Math.max(22, Math.min(44, .09 * Math.max(w, hgt)));
        pl.style.width = (w + 2 * pad) + 'px'; pl.style.height = (hgt + 2 * pad) + 'px'; pl.style.padding = pad + 'px';
        return true;
      };
      logoLoads.push(new Promise(res => {
        const done = ok => { if (!ok && pl.isConnected){ pl.remove(); nm.classList.add('solo'); note.before(nm); } res(); };
        img.onload = () => done(fit() || true);
        img.onerror = () => done(false);
        img.src = sp.logo;
        if (img.complete && img.naturalWidth) done(fit());
        setTimeout(() => { fit(); res(); }, 4000);   // never hold the show up for a slow logo
      }));
    }
    const nm = document.createElement('div'); nm.className = 'sp-name' + (sp.logo ? '' : ' solo'); nm.textContent = sp.name; if (!sp.logo) body.appendChild(nm);
    const note = document.createElement('p'); note.className = 'sp-note'; note.textContent = sp.note || NOTES[t.kind] || ''; body.appendChild(note);
    content.appendChild(el);
    const tierKey = /gold/i.test(t.tier || '') ? 'gold' : /royal/i.test(t.tier || '') ? 'royal' : /silver/i.test(t.tier || '') ? 'silver' : t.kind;
    slides.push({el, secs: (T[tierKey] || T[t.kind] || 8) + (+sp.extra || 0), label: sp.name});   // optional "extra" seconds in sponsors.js
  }
  let cur = 0, timer = 0, paused = false, frameT = 0;
  const qs = new URLSearchParams(location.search);
  const status = () => tellParent({type: 'status', slide: cur, total: slides.length, label: slides[cur].label, paused, theme: themeNow()});
  function show(i){
    i = (i + slides.length) % slides.length;
    const from = slides[cur].el, to = slides[i].el;
    const loopDone = i === 0 && frameOf(from) === 's';           // a full loop just finished
    if (loopDone) preloadNextCouple();
    from.classList.remove('on'); cur = i;
    // the column only changes position once the outgoing slide has cleared, so nothing visible moves
    const moveFrames = frameOf(from) !== frameOf(to);
    clearTimeout(frameT);
    const arrive = () => {
      if (loopDone) swapCouple();                                 // new painting, while it is still invisible
      applyFrame();
      sceneFor(to);
      to.classList.add('on');
    };
    if (moveFrames && RUN){
      // whatever the next page doesn't have leaves together with the outgoing page; what it adds arrives with it
      if (!hasPaint(to)) stage.classList.add('hide-couple');
      if (!hasBar(to)) stage.classList.remove('show-bar');
      frameT = setTimeout(arrive, T.fade * 500);
    } else arrive();
    schedule();
    status();
  }
  // a different father & daughter each time the show comes back round to the title page:
  // the next painting is fetched while the last sponsor slide fades, then swapped in while hidden
  let pre = null;
  function preloadNextCouple(){
    if (!PAINTINGS || COUPLES.length < 2) return;
    pre = new Image(); pre.src = COUPLES[(coupleIx + 1) % COUPLES.length].src;
  }
  function swapCouple(){
    if (!PAINTINGS || COUPLES.length < 2) return;
    const ix = (coupleIx + 1) % COUPLES.length;
    setCouple(ix); $('coupleArt').src = COUPLES[ix].src;
    place();
  }
  function setPaused(v){ paused = !!v; document.body.classList.toggle('paused', paused); schedule(); status(); }
  // commands from the control-room page
  addEventListener('message', e => {
    const m = e.data || {}; if (!m || m.console !== true) return;
    if (m.cmd === 'next') show(cur + 1);
    else if (m.cmd === 'prev') show(cur - 1);
    else if (m.cmd === 'home') show(0);
    else if (m.cmd === 'goto') show(+m.slide || 0);
    else if (m.cmd === 'pause') setPaused(m.value);
    else if (m.cmd === 'theme') setTheme(m.theme, true);
    else if (m.cmd === 'fullscreen') document.body.classList.toggle('full', !!m.value);
    else if (m.cmd === 'hello') status();
  });
  document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('full', !!document.fullscreenElement); tellParent({type: 'fullscreen', value: !!document.fullscreenElement}); });
  function schedule(){
    clearTimeout(timer);
    if (!RUN || paused || slides.length < 2 || document.hidden) return;
    timer = setTimeout(() => show(cur + 1), slides[cur].secs * 1000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ slides[cur].el.classList.add('on'); schedule(); } });
  $('navNext').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
  $('navPrev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
  for (const id of ['navNext', 'navPrev']) $(id).addEventListener('dblclick', e => e.stopPropagation());
  // a plain click anywhere advances too (right half forward, left half back); double-click still toggles fullscreen
  let clickT = 0;
  addEventListener('click', e => {
    if (e.target.closest('button')) return;
    clearTimeout(clickT);
    clickT = setTimeout(() => show(cur + (e.clientX < innerWidth * .3 ? -1 : 1)), 260);
  });
  addEventListener('dblclick', () => clearTimeout(clickT));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home'){ show(0); }
    else if (e.key === 'p' || e.key === 'P'){ setPaused(!paused); }
  });

  sizeViewportCanvases(1920, 1080);
  const ready = [document.fonts ? document.fonts.ready : null,
                 ...['topArt', 'coupleArt', 'logo'].map(id => $(id).decode ? $(id).decode().catch(() => {}) : null),
                 ...logoLoads];
  Promise.all(ready).then(() => {
    fitSponsors(); flattenNames(); measure(); place(); snugShortLogos();
    if (ANIMATE) requestAnimationFrame(draw);
    const start = parseInt(qs.get('slide') || '0', 10) || 0;
    if (start) { slides[0].el.classList.remove('on'); cur = start % slides.length; slides[cur].el.classList.add('on'); applyFrame(); sceneFor(slides[cur].el); }
    requestAnimationFrame(() => requestAnimationFrame(() => { stage.classList.add('go'); schedule(); status(); }));
  });
})();
</script>
